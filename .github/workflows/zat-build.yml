name: Build zat.exe

on:
  push:
    branches: [zat-viewer]
    paths:
      - "zat/**"
      - ".github/workflows/zat-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r zat/requirements.txt

      - name: Build zat.exe
        run: >
          python -m PyInstaller --onefile --noconsole --name zat
          --collect-all pillow_heif zat/zat.py

      - uses: actions/upload-artifact@v4
        with:
          name: zat-exe
          path: dist/zat.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zat-latest
          name: zat (قارئ الصور)
          files: dist/zat.exe
          make_latest: false
          target_commitish: ${{ github.sha }}
