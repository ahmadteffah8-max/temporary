name: Build EchoKey (Windows EXE)

on:
  push:
    branches: [main]
    paths:
      - 'EchoKey/**'
      - '.github/workflows/build-echokey.yml'
    paths-ignore:
      - 'EchoKey/dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: EchoKey
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish framework-dependent (small)
        run: >
          dotnet publish EchoKey.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:PublishReadyToRun=true -o publish/framework-dependent

      - name: Publish self-contained (no .NET install needed)
        run: >
          dotnet publish EchoKey.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true
          -o publish/self-contained

      - name: Rename outputs
        shell: pwsh
        run: |
          Copy-Item publish/framework-dependent/EchoKey.exe publish/EchoKey.exe
          Copy-Item publish/self-contained/EchoKey.exe publish/EchoKey-self-contained.exe

      - uses: actions/upload-artifact@v4
        with:
          name: EchoKey
          path: |
            EchoKey/publish/EchoKey.exe
            EchoKey/publish/EchoKey-self-contained.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: echokey-latest
          name: EchoKey (latest build)
          files: |
            EchoKey/publish/EchoKey.exe
            EchoKey/publish/EchoKey-self-contained.exe

      - name: Commit small EXE into EchoKey/dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/EchoKey.exe dist/EchoKey.exe -Force
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f dist/EchoKey.exe
          git diff --cached --quiet; if ($LASTEXITCODE -ne 0) { git commit -m "EchoKey: update built EXE [skip ci]"; git pull --rebase origin main; git push }
