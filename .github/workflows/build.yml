name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: temporary-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk temporary.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest temporary.apk \
            --title "Latest build" \
            --notes "Auto-built from commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
